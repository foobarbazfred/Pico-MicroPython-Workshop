<!DOCTYPE html>
<!--
    hand_gesture.html をテストするためのビューアHTML
    MQTT Broker：test.mosquitto.org
　  Topics: up_workshop/ex_01/hand-gesture/position
    Message: {"hand_position":[0.2,0.1],"gesture":"paper"} , {"hand_position":[0.2,0.1],"gesture":"rock"}
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>手の位置・ジェスチャー 受信テスト</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; margin: 0; padding: 16px; }
  h2 { text-align: center; margin: 8px 0; }
  #status { text-align: center; font-size: 0.9em; color: #9c9; margin-bottom: 12px; }
  .container { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  #map { position: relative; width: 400px; height: 400px; background: #1e1e1e; border: 2px solid #555; }
  #dot { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px;
         border-radius: 50%; background: gray; transition: left 0.1s, top 0.1s, background 0.1s; }
  .axis { position: absolute; font-size: 12px; color: #888; }
  #panel { width: 360px; }
  #gesture { font-size: 3em; margin: 8px 0; min-height: 1.2em; }
  #position { font-family: monospace; font-size: 1.1em; color: #ffd27f; }
  #raw { font-family: monospace; font-size: 0.85em; background: #222; padding: 8px;
         border-radius: 6px; min-height: 2.5em; word-break: break-all; text-align: left; }
  #log { list-style: none; padding: 0; margin: 12px 0 0; max-height: 240px; overflow-y: auto;
         font-family: monospace; font-size: 0.85em; text-align: left; }
  #log li { padding: 3px 6px; border-bottom: 1px solid #333; }
  .time { color: #888; margin-right: 8px; }
  .err { color: #f88; }
</style>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
</head>
<body>
<h2>手の位置・ジェスチャー 受信テスト</h2>
<div id="status">MQTT: 接続中…</div>

<div class="container">
  <!-- 位置マップ（左上が (0,0)、右下が (1,1)） -->
  <div>
    <div id="map">
      <div id="dot"></div>
      <span class="axis" style="left:4px; top:4px;">(0,0)</span>
      <span class="axis" style="right:4px; bottom:4px;">(1,1)</span>
    </div>
  </div>

  <div id="panel">
    <div id="gesture">---</div>
    <div id="position">hand_position: —</div>
    <h4>受信した生データ</h4>
    <div id="raw">（まだ受信していません）</div>
    <h4>受信履歴（最新50件）</h4>
    <ul id="log"></ul>
  </div>
</div>

<script>
// ===== 設定（送信側と合わせる）=====
const BROKER = "wss://test.mosquitto.org:8081";
const HAND_TOPIC = "up_workshop/ex_01/hand-gesture/position";   # "aaa/bbb/hand-gesture/position";
const MAX_LOG = 50;

const GESTURE_LABELS = { paper: "✋ パー", rock: "✊ グー" };
const GESTURE_COLORS = { paper: "orange", rock: "cyan" };

const statusEl = document.getElementById("status");
const dotEl = document.getElementById("dot");
const gestureEl = document.getElementById("gesture");
const positionEl = document.getElementById("position");
const rawEl = document.getElementById("raw");
const logEl = document.getElementById("log");

const client = mqtt.connect(BROKER, {
  clientId: "receiver-" + Math.random().toString(16).slice(2, 8),
});

client.on("connect", () => {
  statusEl.textContent = "MQTT: 接続済み（" + BROKER + "）";
  client.subscribe(HAND_TOPIC, { qos: 0 }, err => {
    if (err) statusEl.textContent = "購読エラー: " + err.message;
    else statusEl.textContent += " ／ 購読: " + HAND_TOPIC;
  });
});
client.on("reconnect", () => { statusEl.textContent = "MQTT: 再接続中…"; });
client.on("offline", () => { statusEl.textContent = "MQTT: オフライン"; });
client.on("error", err => { statusEl.textContent = "MQTT エラー: " + err.message; });

client.on("message", (topic, message) => {
  const text = message.toString();
  rawEl.textContent = text;

  let data;
  try {
    data = JSON.parse(text);
  } catch {
    addLog(`<span class="err">不正なJSON: ${escapeHtml(text)}</span>`);
    return;
  }

  const pos = data.hand_position;
  if (!Array.isArray(pos) || pos.length !== 2 || pos.some(v => typeof v !== "number")) {
    addLog(`<span class="err">hand_position が不正: ${escapeHtml(text)}</span>`);
    return;
  }
  const [x, y] = pos;
  const gesture = data.gesture ?? null;
  const gestureText = GESTURE_LABELS[gesture] ?? "判定なし";
  const color = GESTURE_COLORS[gesture] ?? "gray";

  // マップ上の点を移動（0〜1 を 0〜100% に変換）
  dotEl.style.left = (clamp01(x) * 100) + "%";
  dotEl.style.top = (clamp01(y) * 100) + "%";
  dotEl.style.background = color;

  gestureEl.textContent = gestureText;
  positionEl.textContent = `hand_position: [${x}, ${y}]   gesture: ${gesture ?? "null"}`;

  addLog(`[${x}, ${y}]  ${escapeHtml(String(gesture))}  ${gestureText}`);
});

function addLog(html) {
  const li = document.createElement("li");
  const time = new Date().toLocaleTimeString("ja-JP");
  li.innerHTML = `<span class="time">${time}</span>${html}`;
  logEl.prepend(li);
  while (logEl.children.length > MAX_LOG) logEl.lastChild.remove();
}

const clamp01 = v => Math.min(1, Math.max(0, v));
const escapeHtml = s => s.replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
</script>
</body>
</html>
