<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">MicroPythonとRaspberry Pi Pico 2 Wから広がるマイコンシステム試作</title>
  <desc id="desc">研修の起点としてMicroPythonとRaspberry Pi Pico 2 Wを示し、センサー、ディスプレイ、ストレージ、カメラ、ネットワークという五つの機能拡張と具体的な用途を示す図</desc>

  <rect width="1500" height="920" fill="#f8fafc"/>

  <g font-family="sans-serif">
    <text x="750" y="64" text-anchor="middle" font-size="38" font-weight="700" fill="#172554">
      MicroPython × Raspberry Pi Pico 2 Wで広げるシステム試作
    </text>
    <text x="750" y="105" text-anchor="middle" font-size="22" fill="#475569">
      基礎研修で学ぶプログラミングから、接続機能を加えてできることへ
    </text>

    <!-- 左:研修の起点 -->
    <rect x="70" y="250" width="330" height="420" rx="28" fill="#ffffff" stroke="#1d4ed8" stroke-width="5"/>
    <rect x="70" y="250" width="330" height="76" rx="28" fill="#1d4ed8"/>
    <rect x="70" y="298" width="330" height="28" fill="#1d4ed8"/>
    <text x="235" y="298" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">研修の起点</text>

    <g transform="translate(235 392)">
      <rect x="-108" y="-55" width="216" height="110" rx="18" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
      <text x="0" y="-12" text-anchor="middle" font-size="24" font-weight="700" fill="#312e81">MicroPython</text>
      <text x="0" y="24" text-anchor="middle" font-size="21" fill="#312e81">×</text>
      <text x="0" y="58" text-anchor="middle" font-size="23" font-weight="700" fill="#312e81">Raspberry Pi Pico 2 W</text>
    </g>

    <text x="235" y="506" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">まずは基礎から</text>
    <text x="235" y="543" text-anchor="middle" font-size="18" fill="#475569">GPIO・PWM・センサー入力</text>
    <text x="235" y="573" text-anchor="middle" font-size="18" fill="#475569">I2C・SPI・ネットワークの基礎</text>

    <path d="M400 460 C470 460 470 460 500 460" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>

    <!-- 機能拡張ラベル -->
    <rect x="500" y="160" width="920" height="58" rx="18" fill="#dbeafe"/>
    <text x="960" y="198" text-anchor="middle" font-size="24" font-weight="700" fill="#1e40af">機能拡張：接続するものを増やすとできることが広がる</text>

    <!-- カード共通設定 -->
    <!-- センサー -->
    <g>
      <rect x="500" y="250" width="420" height="126" rx="20" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
      <circle cx="548" cy="313" r="31" fill="#ccfbf1"/>
      <path d="M548 300v26M535 313h26M540 305l16 16M556 305l-16 16" stroke="#0f766e" stroke-width="4"/>
      <text x="595" y="300" font-size="25" font-weight="700" fill="#134e4a">センサー接続</text>
      <text x="595" y="331" font-size="18" fill="#475569">環境・動き・状態を知る</text>
      <text x="595" y="359" font-size="17" fill="#64748b">温湿度／傾き／照度／距離</text>
    </g>

    <!-- ディスプレイ -->
    <g>
      <rect x="500" y="395" width="420" height="126" rx="20" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
      <circle cx="548" cy="458" r="31" fill="#ede9fe"/>
      <rect x="535" y="445" width="26" height="26" rx="3" fill="none" stroke="#7c3aed" stroke-width="4"/>
      <path d="M540 454h16M540 461h16" stroke="#7c3aed" stroke-width="3"/>
      <text x="595" y="445" font-size="25" font-weight="700" fill="#5b21b6">ディスプレイ接続</text>
      <text x="595" y="476" font-size="18" fill="#475569">数値や状態を見える化</text>
      <text x="595" y="504" font-size="17" fill="#64748b">時計／タイマー／操作パネル</text>
    </g>

    <!-- ストレージ -->
    <g>
      <rect x="500" y="540" width="420" height="126" rx="20" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
      <circle cx="548" cy="603" r="31" fill="#fef3c7"/>
      <rect x="534" y="588" width="28" height="30" rx="4" fill="none" stroke="#d97706" stroke-width="4"/>
      <path d="M539 588v30M557 588v30M534 603h28" stroke="#d97706" stroke-width="3"/>
      <text x="595" y="590" font-size="25" font-weight="700" fill="#92400e">ストレージ接続</text>
      <text x="595" y="621" font-size="18" fill="#475569">データや設定を蓄積</text>
      <text x="595" y="649" font-size="17" fill="#64748b">ログ／プリセット／アセット</text>
    </g>

    <!-- カメラ -->
    <g>
      <rect x="970" y="250" width="450" height="126" rx="20" fill="#ffffff" stroke="#be123c" stroke-width="3"/>
      <circle cx="1022" cy="313" r="31" fill="#ffe4e6"/>
      <rect x="1008" y="300" width="28" height="26" rx="5" fill="none" stroke="#be123c" stroke-width="4"/>
      <circle cx="1022" cy="313" r="7" fill="none" stroke="#be123c" stroke-width="3"/>
      <text x="1070" y="300" font-size="25" font-weight="700" fill="#9f1239">CMOSカメラ接続</text>
      <text x="1070" y="331" font-size="18" fill="#475569">映像・画像を取り込む</text>
      <text x="1070" y="359" font-size="17" fill="#64748b">定点撮影／変化検知／監視</text>
    </g>

    <!-- ネットワーク -->
    <g>
      <rect x="970" y="395" width="450" height="271" rx="20" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
      <circle cx="1022" cy="458" r="31" fill="#e0f2fe"/>
      <circle cx="1022" cy="458" r="17" fill="none" stroke="#0369a1" stroke-width="3"/>
      <path d="M1005 458h34M1022 441c-5 9-5 25 0 34M1022 441c5 9 5 25 0 34" fill="none" stroke="#0369a1" stroke-width="2"/>
      <text x="1070" y="445" font-size="25" font-weight="700" fill="#075985">ネットワーク接続</text>
      <text x="1070" y="476" font-size="18" fill="#475569">遠隔接続・クラウド連携</text>
      <line x1="1070" y1="500" x2="1388" y2="500" stroke="#bae6fd" stroke-width="2"/>
      <text x="1070" y="531" font-size="18" fill="#334155">・Webダッシュボード／簡易サーバ</text>
      <text x="1070" y="562" font-size="18" fill="#334155">・MQTT Pub/Sub</text>
      <text x="1070" y="593" font-size="18" fill="#334155">・Web API／クラウド連携</text>
      <text x="1070" y="624" font-size="18" fill="#334155">・外部AI／PC連携</text>
    </g>

    <!-- 用途の行 -->
    <rect x="970" y="684" width="450" height="126" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
    <text x="1195" y="724" text-anchor="middle" font-size="21" font-weight="700" fill="#1e40af">組み合わせるとできること</text>
    <text x="1195" y="757" text-anchor="middle" font-size="18" fill="#334155">環境モニタ・データロガー</text>
    <text x="1195" y="787" text-anchor="middle" font-size="18" fill="#334155">遠隔監視・画像解析・自動制御</text>

    <!-- 接続線 -->
    <defs>
      <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
        <path d="M0 0l12 6-12 6z" fill="#64748b"/>
      </marker>
    </defs>

    <path d="M920 313h50" fill="none" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M920 458h50" fill="none" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M920 603h50" fill="none" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1195 666v18" fill="none" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="750" y="865" text-anchor="middle" font-size="18" fill="#64748b">
      I2C・SPIなどのインタフェースを介して、必要な機能を段階的に追加できます。
    </text>
  </g>
</svg>
